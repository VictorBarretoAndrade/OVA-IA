<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Painel — EduBot Track</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" integrity="sha384-4LISF5TTJX/fLmGSxO53rV4miRxdg84mZsxmO8Rx5jGtp/LbrixFETvWa5a6sESd" crossorigin="anonymous">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body class="bg-light">
    <!-- MELHORIA (4.4): painel de rastreamento do aluno — recursos consumidos
         por OVA, status das competências e última recomendação do EduBot.
         Mesma identidade visual (Bootstrap) das demais páginas. -->
    <nav class="navbar bg-primary px-3">
        <a href="login.html" class="back-button text-light fs-3"><i class="bi bi-arrow-left-circle-fill"></i></a>
        <span class="navbar-text text-light fs-4 fw-bold">Meu Painel</span>
        <span class="navbar-text text-light student-name"></span>
    </nav>

    <div class="container my-4">
        <!-- Resumo geral -->
        <div class="row g-3 summary-cards mb-4"></div>

        <!-- Recomendação do EduBot -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-success text-light d-flex justify-content-between align-items-center">
                <span><i class="bi bi-robot me-2"></i>EduBot — Recomendação</span>
                <button class="btn btn-sm btn-light ask-edubot">Pedir nova recomendação</button>
            </div>
            <div class="card-body edubot-area">
                <p class="text-muted m-0">Carregando a última recomendação...</p>
            </div>
        </div>

        <div class="row g-4">
            <!-- Recursos consumidos por OVA -->
            <div class="col-lg-7">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-primary text-light">
                        <i class="bi bi-collection-play me-2"></i>Recursos consumidos por OVA
                    </div>
                    <div class="card-body ovas-area"></div>
                </div>
            </div>
            <!-- Status das competências -->
            <div class="col-lg-5">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-primary text-light">
                        <i class="bi bi-mortarboard me-2"></i>Minhas competências
                    </div>
                    <div class="card-body competencies-area"></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="../js/painel.js"></script>
</body>
</html>
