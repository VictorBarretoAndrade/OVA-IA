<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OVA de Reforço — EduBot Track</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" integrity="sha384-4LISF5TTJX/fLmGSxO53rV4miRxdg84mZsxmO8Rx5jGtp/LbrixFETvWa5a6sESd" crossorigin="anonymous">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body class="bg-light">
    <!-- MELHORIA (OVA personalizada): página que renderiza a OVA de reforço
         montada pelo agente EduBot, reaproveitando os mesmos players (vídeo /
         podcast) e o mesmo quiz das OVAs normais. -->
    <nav class="navbar bg-primary px-3">
        <a href="painel.html" class="text-light fs-3"><i class="bi bi-arrow-left-circle-fill"></i></a>
        <span class="navbar-text text-light fs-4 fw-bold"><i class="bi bi-stars me-2"></i>OVA de Reforço</span>
        <span></span>
    </nav>

    <div class="container my-4">
        <div class="card shadow-sm mb-4 pova-header">
            <div class="card-body">
                <span class="badge bg-info text-dark pova-competency mb-2"></span>
                <h2 class="pova-title">Carregando...</h2>
                <p class="pova-message text-muted m-0"></p>
            </div>
        </div>

        <section>
            <h3 class="mb-3"><i class="bi bi-collection-play me-2"></i>Conteúdo de reforço</h3>
            <div class="pova-resources"></div>
        </section>

        <section class="pova-quiz-section mt-5">
            <h3 class="mb-3"><i class="bi bi-patch-question me-2"></i>Quiz de fixação</h3>
            <div class="questions"></div>
        </section>
    </div>

    <script type="module" src="../js/ova_personalizada.js"></script>
</body>
</html>
